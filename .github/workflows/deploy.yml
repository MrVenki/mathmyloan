name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly rate check, Monday 08:30 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Collector agent (weekly rate check)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/collect.js
      - run: node src/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Save refreshed rates
        if: github.event_name != 'push'
        run: |
          git config user.name "loan-compare"
          git config user.email "loan-compare@users.noreply.github.com"
          git add data/products.json data/history.json
          git diff --cached --quiet || (git commit -m "data: weekly rate check" && git push)
      - name: Ping search engines
        run: node src/indexnow.js
