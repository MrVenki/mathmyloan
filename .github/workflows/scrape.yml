name: scrape

# Reads every bank's official rate page (no AI), writes data/drafts.json for review in /admin/,
# and emails a summary when something needs approval. Live rates change only when you approve.
on:
  schedule:
    - cron: "30 0 * * *"   # every day, 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape bank rate pages
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          git config user.name "mathmyloan"
          git config user.email "mathmyloan@users.noreply.github.com"
          node src/scrape/run.js --push
